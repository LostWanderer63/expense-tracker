<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-3 bg-white">

  <form id="expenseForm" class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <label for="expenseamount" class="form-label mb-0 text-nowrap">Choose expenseamount:</label>
    <input type="number" id="expenseamount" class="form-control form-control-sm d-inline-block w-auto" required style="min-width: 110px;">

    <label for="description" class="form-label mb-0 text-nowrap ms-md-2">Choose description:</label>
    <input type="text" id="description" class="form-control form-control-sm d-inline-block w-auto" required style="min-width: 140px;">

    <label for="category" class="form-label mb-0 text-nowrap ms-md-2">Choose a category</label>
    <select id="category" class="form-select form-select-sm d-inline-block w-auto">
      <option value="fuel">fuel</option>
      <option value="food">food</option>
      <option value="electricity">electricity</option>
      <option value="Movie">Movie</option>
    </select>

    <button type="submit" class="btn btn-sm btn-outline-dark border ms-md-2">Add Expense</button>
  </form>

  <ul id="listOfExpenses" class="ps-4"></ul>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
